# Magic clubs and societies in Scotland - ALL FICTIONAL test data.
# Club names, people, venues, emails and phone numbers are invented.
# Emails use example.org and phone numbers use the Ofcom drama range
# (07700 900000-900999), so none of them reach a real person.
#
# Only contacts with `consent: true` are shown on the site.
#
# Fields:
#   name, slug (unique, used in the URL), town, region, description, website
#   meeting: { schedule, venue, address }
#   contacts: [ { name, role, email, phone, consent } ]

- name: The Thistle Circle of Conjurors
  slug: thistle-circle
  town: Edinburgh
  region: Lothian
  description: >-
    A friendly society for close-up and parlour magicians, with a lecture
    from a visiting performer most months and a close-up competition each spring.
  website: https://example.org/thistle-circle
  meeting:
    schedule: 2nd and 4th Thursday, 7.30pm
    venue: The Lantern Rooms
    address: 12 Fictional Wynd, Edinburgh
  contacts:
    - name: Morag Lindsay
      role: Secretary
      email: secretary@thistle-circle.example.org
      phone: 07700 900101
      consent: true
    - name: Alasdair Baird
      role: Treasurer
      email: treasurer@thistle-circle.example.org
      consent: false   # hidden: no consent to publish

