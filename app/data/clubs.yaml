# Magic clubs and societies in Scotland.
#
# CHANGE_ME_CLUB_DATA: these are FICTIONAL sample entries so the site has
# something to show. Replace them with real clubs before going public.
#
# Only contacts with `consent: true` are shown on the site (UK GDPR).
# Prefer club role addresses (secretary@club.example) over personal ones.
#
# Fields:
#   name, slug (unique, used in the URL), town, region, description, website
#   meeting: { schedule, venue, address }
#   contacts: [ { name, role, email, phone, consent } ]

- name: Sample Highland Magic Society
  slug: sample-highland-magic-society
  town: Inverness
  region: Highland
  description: Example entry - a friendly club for magicians of all levels.
  website: https://example.org/highland-magic
  meeting:
    schedule: 2nd Tuesday of each month, 7.30pm
    venue: CHANGE_ME venue name
    address: CHANGE_ME street, Inverness
  contacts:
    - name: CHANGE_ME Secretary Name
      role: Secretary
      email: secretary@example.org
      consent: true

- name: Sample Capital Conjurors
