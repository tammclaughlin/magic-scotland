---
# Settings shared by dev and prod. `env` comes from inventory/<env>/group_vars.
#
# Run against dev (default) or prod:
#   make deploy-ec2 ENV=dev
#   ansible-playbook -i inventory/prod site.yml

project: magic-scotland
aws_region: eu-west-2
timezone: Europe/London

# ---------------------------------------------------------------------------
# SSH connection (plain SSH)
#   First run: as the Ubuntu AMI's default user with your admin key.
#   After that: as your own admin user (set keep_bootstrap_user_login: false).
#   GitHub Actions: as admin_user with the CI key (-e ansible_user=... --private-key).
# ---------------------------------------------------------------------------
bootstrap_user: ubuntu
keep_bootstrap_user_login: true
ansible_user: "{{ bootstrap_user if keep_bootstrap_user_login | bool else admin_user }}"
ansible_ssh_private_key_file: "~/.ssh/magic-scotland"

# Your admin account on the servers. In CI these come from GitHub variables.
admin_user: "{{ lookup('env', 'ADMIN_USER') | default('tam', true) }}"  # e.g. tam
admin_public_key_file: "~/.ssh/magic-scotland.pub"
admin_public_key: >-
  {{ lookup('env', 'ADMIN_PUBLIC_KEY')
     if lookup('env', 'ADMIN_PUBLIC_KEY')
     else lookup('file', admin_public_key_file) }}

# The separate key GitHub Actions uses (public half only). Optional: if the
# file/variable is missing, only your admin key is installed.
ci_public_key_file: "~/.ssh/magic-scotland-ci.pub"
ci_public_key: >-
  {{ lookup('env', 'CI_PUBLIC_KEY')
     if lookup('env', 'CI_PUBLIC_KEY')
     else lookup('file', ci_public_key_file, errors='ignore') | default('', true) }}

# ---------------------------------------------------------------------------
# App
#   app_mode: native  -> Python venv + Gunicorn + systemd
#             docker  -> the same ARM image as ECS, run with Docker Compose
# ---------------------------------------------------------------------------
app_mode: native
app_name: magic
app_user: magic
app_dir: /opt/magic
app_port: 8000
app_version: "{{ lookup('env', 'GITHUB_SHA') | default('local', true) }}"
ssm_param_prefix: "/{{ project }}/{{ env }}"

# Docker mode: worked out from your AWS account if not set (see site.yml).
ecr_repository_url: "{{ lookup('env', 'ECR_REPOSITORY_URL') }}"
app_image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"

# ---------------------------------------------------------------------------
# Web / TLS - no domain, so plain HTTP on the EC2 public address.
# ---------------------------------------------------------------------------
domain_name: ""
enable_tls: "{{ domain_name | length > 0 }}"
letsencrypt_email: ""  # only used if you add a domain later

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
cloudwatch_log_group: "/{{ project }}/{{ env }}/ec2"
cloudwatch_retention_days: 14
