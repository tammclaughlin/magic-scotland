---
# Docker mode: run the SAME image that ECS runs, pulled from ECR,
# published on 127.0.0.1 so Nginx stays the only way in.

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present

- name: Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    state: present
    update_cache: true

- name: Install AWS CLI v2 (not packaged in apt on Ubuntu 24.04)
  community.general.snap:
    name: aws-cli
    classic: true

- name: Enable Docker
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Stop the native app if it is running
  ansible.builtin.systemd_service:
    name: "{{ app_name }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Create compose directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0755"

- name: Compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ app_dir }}/compose.yml"
    mode: "0644"

- name: Log in to ECR with the instance role
  ansible.builtin.shell: |
    set -o pipefail
    aws ecr get-login-password --region {{ aws_region }} \
      | docker login --username AWS --password-stdin {{ ecr_repository_url.split('/')[0] }}
  args:
    executable: /bin/bash
  changed_when: false
  no_log: true

- name: Pull and start the container
  ansible.builtin.command: docker compose -f {{ app_dir }}/compose.yml up -d --pull always --remove-orphans
  register: compose_up
  changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr"

- name: Remove old images
  ansible.builtin.command: docker image prune -af --filter "until=168h"
  changed_when: false
