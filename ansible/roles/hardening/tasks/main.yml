---
- name: Install fail2ban and ufw
  ansible.builtin.apt:
    name: [fail2ban, ufw]
    state: present

- name: SSH hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: fail2ban jail for SSH
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Enable fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: started
    enabled: true

# ufw mirrors the AWS security group: defence in depth.
- name: ufw - allow SSH, HTTP, HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["22", "80", "443"]

- name: ufw - default deny incoming, enable
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
