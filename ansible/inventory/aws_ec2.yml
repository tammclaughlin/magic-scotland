# Dynamic inventory: finds the web server by its tags, no IPs hard-coded.
# Needs boto3/botocore and AWS credentials on the machine running Ansible.
#   ansible-inventory --graph
plugin: amazon.aws.aws_ec2
regions:
  - eu-west-2
filters:
  tag:Project: magic-scotland
  tag:Env: dev
  tag:Role: web
  instance-state-name: running
keyed_groups:
  - key: tags.Role
    prefix: role
hostnames:
  - tag:Name
compose:
  # Plain SSH uses the public IP; SSM uses the instance ID.
  ansible_host: public_ip_address
  ansible_aws_ssm_instance_id: instance_id
