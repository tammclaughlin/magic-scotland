---
# Configure the web server.
#
#   ansible-galaxy collection install -r requirements.yml
#   ansible-playbook site.yml --check --diff          # dry run (dev)
#   ansible-playbook site.yml                         # dev
#   ansible-playbook -i inventory/prod site.yml       # prod
#   ansible-playbook site.yml --tags app              # just redeploy the app
#   ansible-playbook site.yml -e app_mode=docker      # run the container instead
#
# Or use the Makefile: make deploy-ec2 ENV=dev

- name: Configure magic-scotland web server
  hosts: role_web
  become: true
  gather_facts: true

  pre_tasks:
    - name: Fail early if placeholders are still set
      ansible.builtin.assert:
        that:
          - "'CHANGE_ME' not in admin_user"
          - env in ['dev', 'prod']
        fail_msg: "Set admin_user in group_vars/all.yml and run with -i inventory/dev or inventory/prod."

    - name: Work out the ECR repository for docker mode
      when: app_mode == 'docker' and ecr_repository_url | length == 0
      block:
        - name: Look up the AWS account
          amazon.aws.aws_caller_info:
          register: caller
          delegate_to: localhost
          become: false
          run_once: true

        - name: Set ECR repository URL
          ansible.builtin.set_fact:
            ecr_repository_url: "{{ caller.account }}.dkr.ecr.{{ aws_region }}.amazonaws.com/{{ project }}-{{ env }}"

    - name: Wait for the instance to accept connections
      ansible.builtin.wait_for_connection:
        timeout: 300

  roles:
    - role: common
      tags: [common]
    - role: hardening
      tags: [hardening]
    - role: app
      tags: [app]
      when: app_mode == 'native'
    - role: docker
      tags: [docker, app]
      when: app_mode == 'docker'
    - role: nginx
      tags: [nginx]
    - role: tls
      tags: [tls]
      when: enable_tls | bool
    - role: cloudwatch
      tags: [cloudwatch]

  post_tasks:
    - name: Smoke test the site through Nginx
      ansible.builtin.uri:
        url: "http://127.0.0.1/healthz"
        status_code: [200, 301]
      register: smoke
      retries: 10
      delay: 3
      until: smoke.status in [200, 301]
      tags: [always]
