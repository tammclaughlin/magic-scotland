name: Deploy to EC2

# Runs the Ansible playbook against the EC2 instance over AWS SSM
# (no SSH port opened to GitHub, no SSH private key stored in GitHub).
#
# Repository VARIABLES: AWS_ROLE_ARN, ANSIBLE_SSM_BUCKET, ADMIN_USER,
#   ADMIN_PUBLIC_KEY, EC2_SITE_URL, ENABLE_EC2_DEPLOY ("true" to turn on)
#   and, for app_mode=docker, ECR_REPOSITORY_URL

on:
  push:
    branches: [main]
    paths: ["app/**", "ansible/**", ".github/workflows/deploy-ec2.yml"]
  workflow_dispatch:
    inputs:
      app_mode:
        description: native or docker
        default: native
        type: choice
        options: [native, docker]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.ENABLE_EC2_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ansible
    env:
      AWS_REGION: eu-west-2
      ANSIBLE_USE_SSM: "1"
      ANSIBLE_SSM_BUCKET: ${{ vars.ANSIBLE_SSM_BUCKET }}
      ADMIN_USER: ${{ vars.ADMIN_USER }}
      ADMIN_PUBLIC_KEY: ${{ vars.ADMIN_PUBLIC_KEY }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      IMAGE_TAG: ${{ github.sha }}
      ANSIBLE_FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible and the SSM Session Manager plugin
        run: |
          pip install ansible-core boto3 botocore
          ansible-galaxy collection install -r requirements.yml
          curl -sSLo /tmp/smp.deb "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i /tmp/smp.deb
      - name: Show inventory
        run: ansible-inventory --graph
      - name: Run playbook
        run: ansible-playbook site.yml -e app_mode=${{ inputs.app_mode || 'native' }}
      - name: Smoke test from outside
        if: vars.EC2_SITE_URL != ''
        run: |
          for i in $(seq 1 10); do
            curl -fsS "${{ vars.EC2_SITE_URL }}/healthz" && exit 0
            sleep 5
          done
          exit 1
