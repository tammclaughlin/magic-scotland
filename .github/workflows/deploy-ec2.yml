name: Deploy to EC2

# Ansible over plain SSH: dev first, then prod after your approval.
# Skips an environment that has no running web server.

on:
  push:
    branches: [main]
    paths: ["app/**", "ansible/**", ".github/workflows/deploy-ec2.yml", ".github/workflows/_ec2-deploy.yml"]
  workflow_dispatch:
    inputs:
      app_mode:
        description: native (Python + systemd) or docker (ECR image)
        default: native
        type: choice
        options: [native, docker]

permissions:
  id-token: write
  contents: read

jobs:
  dev:
    uses: ./.github/workflows/_ec2-deploy.yml
    with:
      env: dev
      app_mode: ${{ inputs.app_mode || 'native' }}
    secrets: inherit

  prod:
    needs: dev
    uses: ./.github/workflows/_ec2-deploy.yml
    with:
      env: prod
      app_mode: ${{ inputs.app_mode || 'native' }}
    secrets: inherit
