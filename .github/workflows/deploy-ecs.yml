name: Deploy to ECS Fargate

# Build the ARM image ONCE, push it to the dev ECR repo tagged with the commit
# SHA, deploy to dev, then promote the SAME image to prod (after approval).
# Skips an environment whose ECR repo or ECS service doesn't exist yet.

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy-ecs.yml", ".github/workflows/_ecs-deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.repo.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Find the dev ECR repository
        id: repo
        run: |
          url=$(aws ecr describe-repositories --repository-names magic-scotland-dev \
                  --query 'repositories[0].repositoryUri' --output text 2>/dev/null || true)
          if [ -z "$url" ]; then
            echo "::notice::magic-scotland-dev ECR repo not found - apply infra first."
            echo "exists=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/amazon-ecr-login@v2
        if: steps.repo.outputs.exists == 'true'
      - uses: docker/setup-qemu-action@v3
        if: steps.repo.outputs.exists == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.repo.outputs.exists == 'true'
      - name: Build and push (linux/arm64 for Graviton)
        if: steps.repo.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.repo.outputs.url }}:${{ github.sha }}
            ${{ steps.repo.outputs.url }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan pushed image
        if: steps.repo.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.repo.outputs.url }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  dev:
    needs: build-push
    if: needs.build-push.outputs.pushed == 'true'
    uses: ./.github/workflows/_ecs-deploy.yml
    with:
      env: dev
      image_tag: ${{ github.sha }}
    secrets: inherit

  prod:
    needs: dev
    uses: ./.github/workflows/_ecs-deploy.yml
    with:
      env: prod
      image_tag: ${{ github.sha }}
    secrets: inherit
