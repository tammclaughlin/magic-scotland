name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App - lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: black --check .
      - run: flake8 .
      - run: pytest -q

  image:
    name: Docker - build and scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3 # emulate ARM: the servers are Graviton
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM image
        uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/arm64
          load: true
          tags: magic-scotland:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: magic-scotland:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    name: Terraform - fmt, validate, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13"
      - run: terraform fmt -check -recursive infra
      - name: Validate each stack (no backend)
        run: |
          for dir in infra/bootstrap infra/envs/dev infra/envs/prod; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        working-directory: infra
        run: |
          tflint --init
          tflint --recursive --config "$PWD/.tflint.hcl"
      - name: Security scan of Terraform
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: CRITICAL,HIGH
          exit-code: "0" # report only while learning; set to "1" to enforce

  ansible:
    name: Ansible - lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core ansible-lint boto3 botocore
      - run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-lint site.yml
      - run: ansible-playbook site.yml --syntax-check -i localhost,
        env:
          ADMIN_PUBLIC_KEY: ssh-ed25519 AAAA-placeholder-for-syntax-check
