name: Destroy an environment

# Manual only. Tears down infra/envs/<env> to stop charges.
# The bootstrap stack (state bucket, OIDC role, SES, budget) is not touched.

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to destroy
        type: choice
        options: [dev, prod]
      confirm:
        description: Type "destroy-dev" or "destroy-prod" to confirm
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm
        if: inputs.confirm != format('destroy-{0}', inputs.env)
        run: |
          echo "Confirmation text does not match destroy-${{ inputs.env }}"
          exit 1

  destroy:
    needs: check
    uses: ./.github/workflows/_terraform-apply.yml
    with:
      env: ${{ inputs.env }}
      destroy: true
    secrets: inherit
