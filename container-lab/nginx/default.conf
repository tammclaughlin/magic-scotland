# Nginx in front of Gunicorn, the container way.
# Same rules as the EC2 path's ../../ansible/roles/nginx/templates/magic.conf.j2. Compare them.
#
# Gunicorn runs in a second container in the same Fargate task. Containers in a task
# share one network namespace, so the app is on 127.0.0.1:8000, just as on the EC2 server.
# This file goes into /etc/nginx/conf.d/, which the image's nginx.conf includes inside http {}.

server_tokens off;

limit_req_zone $binary_remote_addr zone=contact:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Debian's /etc/nginx/proxy_params doesn't exist in the official image: set them here.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
    }

    location = /contact {
        limit_req zone=contact burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 30s;
    }
}
